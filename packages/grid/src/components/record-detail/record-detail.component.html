<div class="d-flex flex-column ai-record-detail">
    <div class="d-flex align-items-center justify-content-between pl-8 pr-5 record-detail-header">
        <span class="record-title" thyFlexibleText [thyTooltipContent]="recordTitle()">
            {{ recordTitle() }}
        </span>

        <div class="record-navigation">
            <a
                thyAction
                href="javascript:;"
                [thyTooltip]="i18nTexts().previousRecord"
                [thyDisabled]="!recordNavigation()?.hasPrevious"
                (click)="previousRecord()"
                ><thy-icon thyIconName="angle-up"></thy-icon
            ></a>

            <a
                thyAction
                href="javascript:;"
                [thyTooltip]="i18nTexts().nextRecord"
                [thyDisabled]="!recordNavigation()?.hasNext"
                (click)="nextRecord()"
                ><thy-icon thyIconName="angle-down"></thy-icon
            ></a>
        </div>
        <thy-divider [thyVertical]="true" thyColor="light"></thy-divider>
        <div class="header-operations">
            <a
                thyAction
                thyActiveClass="active"
                href="javascript:;"
                [thyDropdown]="headerMoreMenu"
                thyTrigger="click"
                thyPlacement="bottomRight"
                [thyTooltip]="i18nTexts().more"
                ><thy-icon thyIconName="list"></thy-icon
            ></a>

            <thy-dropdown-menu #headerMoreMenu>
                <a
                    class="ai-table-record-detail-remove"
                    thyDropdownMenuItem
                    [thyDisabled]="readonly()"
                    href="javascript:;"
                    (click)="deleteRecord()"
                >
                    <thy-icon thyIconName="trash"></thy-icon>
                    <span>{{ i18nTexts().deleteRecord }}</span>
                </a>
            </thy-dropdown-menu>

            <a thyAction href="javascript:;" (click)="close()" [thyTooltip]="i18nTexts().close"
                ><thy-icon thyIconName="close"></thy-icon
            ></a>
        </div>
    </div>

    <div class="record-detail-body">
        <div class="px-8 cell-list-viewport">
            @for (field of fields(); track field._id) {
                <div class="pt-4 cell-item" [class.active]="activeFieldId === field._id">
                    <div #fieldMenuOrigin class="d-flex align-items-center justify-content-between mb-2 cell-header">
                        <div class="d-flex align-items-center cell-label">
                            <span class="d-flex align-items-center mr-2 text-muted font-size-md">
                                @if (fieldIconPath(field)) {
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" viewBox="0 0 16 16">
                                        <path [attr.d]="fieldIconPath(field)" fill="currentColor"></path>
                                    </svg>
                                }
                            </span>
                            <span class="d-flex align-items-center font-size-base">
                                {{ field.name }}
                            </span>
                        </div>
                        @if (!readonly()) {
                            <a
                                class="field-action"
                                thyAction
                                [thyActionActive]="fieldMenuActive()[field._id]"
                                href="javascript:;"
                                (click)="fieldMenuMoreClick($event, field._id, fieldMenuOrigin)"
                                ><thy-icon thyIconName="more-vertical"></thy-icon
                            ></a>
                        }
                    </div>

                    <div class="dynamic-cell-editor" (click)="cellClick(field._id)">
                        <ai-dynamic-cell-editor
                            [aiTable]="aiTable()"
                            [fieldId]="field._id"
                            [recordId]="currentRecordId()"
                            [references]="references()"
                            (updateFieldValues)="fieldValueChange($event)"
                        >
                        </ai-dynamic-cell-editor>
                    </div>
                </div>
            }
        </div>
        <div class="py-4 px-5">
            @if (!readonly()) {
                <button class="p-0" thyButton="link-secondary" thySize="md" (click)="addNewField($event)">
                    <thy-icon thyIconName="plus"></thy-icon>
                    <span>{{ i18nTexts().addField }}</span>
                </button>
            }
        </div>
    </div>
</div>

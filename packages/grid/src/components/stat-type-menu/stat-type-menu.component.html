@if (field()) {
    @for (menu of statMenus(); track index; let index = $index) {
        <a
            thyDropdownMenuItem
            href="javascript:;"
            [ngClass]="{
                active: selectStatType() === menu.type
            }"
            (click)="execute(menu)"
        >
            <span>{{ menu.name }}</span>
        </a>
    }
}

<p>筛选</p>

<app-condition-selector
    class="d-block mb-4"
    [fields]="fields()"
    [logic]="logic()"
    [conditions]="conditions()"
    (conditionsChange)="conditionsChange($any($event))"
>
</app-condition-selector>

<ai-table-grid
    [(aiRecords)]="records"
    [(aiFields)]="fields"
    [aiReferences]="references()"
    [aiPlugins]="plugins"
    [aiBuildRenderDataFn]="buildRenderDataFn()"
    (aiTableInitialized)="aiTableInitialized($event)"
>
</ai-table-grid>
